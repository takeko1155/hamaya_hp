name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Apps Script (Google Docs / Slides) calls this when content changes
  repository_dispatch:
    types: [content-updated]
  # daily safety net; also expires NEW badges and old notices (00:05 JST)
  schedule:
    - cron: '5 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          NOINDEX: '1' # remove when this becomes the live site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
